<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ballpark</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <section class="section section--status" id="status-section">
      <p class="status-line" id="status-line">Checking this page…</p>
      <p class="hint status-detail" id="status-detail"></p>
      <button class="override-btn" id="override-btn" hidden></button>
    </section>
    <header class="header">
      <img src="icons/ballpark_48.png" alt="" class="logo" width="28" height="28" />
      <div>
        <h1>Ballpark</h1>
        <p class="tagline">Calibrate numbers as you read.</p>
      </div>
    </header>

    <section class="section">
      <label for="api-key">Anthropic API key</label>
      <div class="input-row">
        <input
          type="password"
          id="api-key"
          placeholder="sk-ant-..."
          autocomplete="off"
          spellcheck="false"
        />
        <button id="save-btn">Save</button>
      </div>
      <p class="hint key-state" id="key-state"></p>
      <p class="hint" id="save-status"></p>
      <p class="hint">
        <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener noreferrer">Get an API key →</a>
      </p>
    </section>

    <section class="section section--footer">
      <p class="hint">
        Click any <span class="demo-underline">underlined number</span> on a page
        to calibrate it.
      </p>
      <p class="hint">
        <a href="welcome.html" target="_blank" rel="noopener noreferrer">Open full setup guide →</a>
      </p>
    </section>
  </div>
  <script src="lib/status.js"></script>
  <script src="popup.js"></script>
</body>
</html>
